<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zombie vs Home</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">SURVIVAL DEFENSE</p>
          <h1>Zombie vs Home</h1>
        </div>
      </header>

      <main class="game-panel">
        <canvas id="gameCanvas" width="960" height="600" aria-label="Zombie vs Home game"></canvas>

        <div class="hud">
          <div class="stat">
            <span class="label">Home</span>
            <strong id="homeHealth">100</strong>
          </div>
          <div class="stat">
            <span class="label">Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat">
            <span class="label">Wave</span>
            <strong id="wave">1</strong>
          </div>
          <div class="stat">
            <span class="label">Power</span>
            <strong id="powerLevel">1</strong>
          </div>
        </div>

        <button id="upgradeBtn" class="upgrade-btn" type="button">Upgrade (50)</button>

        <div id="message" class="message visible">
          <h2>Defend the Home</h2>
          <p>Move with WASD or Arrow Keys. Aim with the mouse. Click to shoot.</p>
          <p>Press any movement key to start.</p>
        </div>
      </main>
    </div>

    <script src="game.js"></script>
  </body>
</html>
